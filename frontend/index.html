<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Docker Control Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --terminal-bg: #000;
      --terminal-fg: #22c55e;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      padding: 2rem 2rem 1.25rem;
      border-bottom: 1px solid var(--panel-border);
    }

    .header h1 {
      margin: 0 0 0.4rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem 2rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      margin-top: 0.35rem;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .console-wrap {
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .console-wrap h2 {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #console {
      flex: 1;
      background: var(--terminal-bg);
      color: var(--terminal-fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 360px;
    }

    #console .log-info { color: #38bdf8; }
    #console .log-error { color: var(--danger); }
    #console .log-ok { color: #22c55e; }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Mini Docker Control Dashboard</h1>
    <p>40% Milestone: Linux Process &amp; Namespace Isolation Engine</p>
  </header>

  <main class="layout">
    <section class="panel">
      <form class="form" id="container-form">
        <label>
          Container Hostname
          <input
            id="hostname"
            name="hostname"
            type="text"
            value="demo-container"
            autocomplete="off"
          />
        </label>
        <label>
          Execution Command
          <input
            id="command"
            name="command"
            type="text"
            value="hostname; echo '--- Process List ---'; ps aux"
            autocomplete="off"
          />
        </label>
        <button type="submit" id="launch-btn">Launch Container</button>
      </form>
    </section>

    <section class="panel console-wrap">
      <h2>Container Console</h2>
      <pre id="console">Ready. Configure hostname and command, then launch.</pre>
    </section>
  </main>

  <script>
    const consoleEl = document.getElementById("console");
    const form = document.getElementById("container-form");
    const launchBtn = document.getElementById("launch-btn");

    function appendLine(text, className) {
      const span = document.createElement("span");
      if (className) span.className = className;
      span.textContent = text + "\n";
      consoleEl.appendChild(span);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function setConsole(htmlOrClear) {
      consoleEl.textContent = "";
    }

    async function runContainer() {
      const hostname = document.getElementById("hostname").value.trim() || "demo-container";
      const command = document.getElementById("command").value.trim() || "hostname; echo '--- Process List ---'; ps aux";

      setConsole();
      appendLine("$ launching container...", "log-info");
      appendLine("hostname: " + hostname, "log-info");
      appendLine("command:  " + command, "log-info");
      appendLine("POST /api/run-container", "log-info");
      appendLine("");

      launchBtn.disabled = true;

      try {
        const response = await fetch("/api/run-container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hostname, command }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          appendLine("status: failed (" + response.status + ")", "log-error");
          appendLine(data.error || "Unknown error", "log-error");
          if (data.stderr) {
            appendLine("");
            appendLine(data.stderr, "log-error");
          }
          return;
        }

        appendLine("status: success", "log-ok");
        appendLine("--- stdout ---", "log-info");
        appendLine(data.output || "(empty)");
        if (data.stderr) {
          appendLine("--- stderr ---", "log-info");
          appendLine(data.stderr);
        }
      } catch (err) {
        appendLine("status: network error", "log-error");
        appendLine(String(err.message || err), "log-error");
      } finally {
        launchBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      runContainer();
    });
  </script>
</body>
</html>
